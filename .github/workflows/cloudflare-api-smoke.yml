name: Joe&dave API smoke tests

on:
  push:
    branches: [custom/operations-intelligence]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/cloudflare-api-smoke.yml'
  workflow_dispatch:

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker JavaScript syntax
        run: node --input-type=module --check < cloudflare/worker.js
      - name: Test live API boundaries
        env:
          API_URL: https://joe-dave-operations-api.uchechukwuanuforo.workers.dev
        run: node --test cloudflare/tests/smoke.mjs
